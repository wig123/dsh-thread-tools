    <text x="44" y="334" fill="#8b949e">created=2026-09-11T07:56:51.011Z cwd=/work/app state=live,current</text>
    <text x="28" y="358" fill="#8b949e">- id=session-97c6bb3d-52dd-43de-90b8-0b6337cb504b title="session-97c6bb3d-52dd-43de-90b8-0b6337cb504b"</text>
